Description=Class Icons and Party Buff Options in one: they are also available as separate add-ons. Each part has its own switch or section in Options.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
